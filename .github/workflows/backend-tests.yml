# Backend tests on a fresh PostgreSQL, with the cross-school isolation suite first.
#
# The database user is an ordinary role that owns the database, like warsi_user on
# DigitalOcean: not a superuser and without BYPASSRLS, so row-level security applies
# to it. tests/tenant/test_row_level_security.py fails if that ever changes.
name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - "sunrise-backend-fastapi/**"
      - "Database/**"
      - "redeploy_database.py"
      - "migrate_database.py"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "sunrise-backend-fastapi/**"
      - "Database/**"
      - "redeploy_database.py"
      - "migrate_database.py"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://warsi_user:ci-only-password@localhost:5432/warsi_db
      DB_SCHEMA: school
      DEFAULT_SCHOOL_CODE: sunrise
      ENVIRONMENT: test
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sunrise-backend-fastapi/requirements.txt

      - name: Install dependencies
        run: pip install -r sunrise-backend-fastapi/requirements.txt

      - name: Create the application role and database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE warsi_user LOGIN PASSWORD 'ci-only-password' NOSUPERUSER NOBYPASSRLS NOCREATEROLE" \
            -c "CREATE DATABASE warsi_db OWNER warsi_user"

      - name: Deploy the schema
        run: python redeploy_database.py --yes

      - name: Check no migration is pending
        run: |
          python migrate_database.py --status | tee migrate-status.txt
          grep -q "^0 pending migration(s)." migrate-status.txt

      - name: Cross-school isolation suite
        working-directory: sunrise-backend-fastapi
        run: python -m pytest tests/tenant tests/isolation -o addopts="" --asyncio-mode=auto -p no:cacheprovider -q

      - name: Fee and transport tests
        working-directory: sunrise-backend-fastapi
        run: python -m pytest tests/fees tests/transport -o addopts="" --asyncio-mode=auto -p no:cacheprovider -q
